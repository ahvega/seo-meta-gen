[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-meta-gen"
version = "0.1.0"
authors = [
    { name = "Adalberto H. Vega", email = "adalberto_vega@yahoo.com" },
]
description = "A tool for generating SEO meta tags"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4==4.12.3",
    "python-dotenv==1.0.0",
    "openai==1.12.0",
    "google-generativeai==0.3.2",
    "deepseek==1.0.0",
    "anthropic==0.18.1",
    "python-wordpress-xmlrpc==2.3",
    "tqdm==4.66.2",
    "langdetect==1.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "black>=23.0",
    "flake8>=6.0",
]

[tool.setuptools]
packages = ["seo_meta_gen"] 